<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介 | プロフィール</title>
    <style>
        /* ページ全体の設定 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #f7f9fc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 中央の白いカード */
        .profile-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        /* アイコン画像（仮の丸いグレーの円） */
        .profile-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #e2e8f0;
            margin: 0 auto 20px auto;
            object-fit: cover;
        }

        /* 名前と肩書き */
        h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            color: #1a202c;
        }
        .job-title {
            font-size: 14px;
            color: #718096;
            margin-bottom: 24px;
        }

        /* 自己紹介文 */
        .bio {
            font-size: 15px;
            line-height: 1.8;
            color: #4a5568;
            margin-bottom: 30px;
        }

        /* リンクボタンの並び */
        .links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        /* 個別のリンクボタン */
        .links a {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: #edf2f7;
            color: #2d3748;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }
        
        .links a:hover {
            background-color: #e2e8f0;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- プロフィール画像 -->
        <!-- 自分の画像を使いたい場合は、下の div を消して img タグを使います -->
        <div class="profile-icon"></div>
        <!-- <img src="profile.jpg" alt="プロフィール画像" class="profile-icon"> -->

        <!-- 名前 -->
        <h1>山田 太郎</h1>
        <p class="job-title">Web Developer / Designer</p>

        <!-- 自己紹介 -->
        <p class="bio">
            こんにちは！福岡を拠点に活動しています。<br>
            シンプルで美しいデザインを作ることが好きです。<br>
            趣味はカメラとコーヒーの飲み歩きです。
        </p>

        <!-- リンク -->
        <div class="links">
            <a href="https://github.com/あなたのID" target="_blank">GitHub</a>
            <a href="#" target="_blank">Twitter</a>
            <a href="#" target="_blank">Blog</a>
        </div>
    </div>

</body>
</html>
